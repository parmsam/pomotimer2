<!doctype html>
<html lang="en" data-mode="focus">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="An aesthetic, customizable Pomodoro timer." />
    <meta name="theme-color" content="#1c1930" />
    <title>pomo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="grain"></div>
    </div>

    <div class="app">
      <header class="topbar">
        <div class="brand"><span class="brand-dot"></span>pomo</div>
        <div class="topbar-actions">
        <button id="streak" class="streak-chip" type="button" title="Streak">
          <span aria-hidden="true">🔥</span><span class="streak-count">0</span>
        </button>
        <button id="shortcuts-open" class="icon-btn kbd-only" aria-label="Keyboard shortcuts (?)" title="Keyboard shortcuts (?)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7.5 14h9"/></svg>
        </button>
        <button id="tasks-toggle" class="icon-btn" aria-label="Show tasks (T)" title="Tasks (T)" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>
        </button>
        <button id="settings-open" class="icon-btn" aria-label="Settings (,)" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
        </div>
      </header>

      <main class="stage">
        <div class="timer-col">
        <div class="modes" role="tablist" aria-label="Session type">
          <span class="mode-pill" aria-hidden="true"></span>
          <button role="tab" data-mode="focus">Focus<span class="mode-count" hidden></span></button>
          <button role="tab" data-mode="short">Short Break<span class="mode-count" hidden></span></button>
          <button role="tab" data-mode="long">Long Break<span class="mode-count" hidden></span></button>
        </div>

        <div class="dial">
          <div class="face-layer" aria-hidden="true"></div>
          <div class="dial-center">
            <div class="time" id="time" role="timer" aria-live="off"></div>
            <div class="sub" id="sub"></div>
          </div>
          <div class="burst" id="burst" aria-hidden="true"></div>
        </div>

        <div class="controls">
          <button id="reset" class="icon-btn" aria-label="Reset (R)" title="Reset (R)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button id="toggle" class="primary" aria-label="Start (Space)">
            <span class="primary-label">Start</span>
          </button>
          <button id="skip" class="icon-btn" aria-label="Skip (S)" title="Skip (S)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 10 8-10 8V4Z"/><path d="M19 5v14"/></svg>
          </button>
        </div>

        <div class="cycle" id="cycle"></div>
        <div class="goal" id="goal" role="img">
          <div class="goal-bar"><span class="goal-fill"></span></div>
          <span class="goal-text" aria-hidden="true"></span>
        </div>

        <div class="interrupt" id="interrupt" hidden>
          <button class="interrupt-btn" type="button" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13h6l-1 8 8-10h-6l1-8Z"/></svg>
            Interrupted?
            <span class="interrupt-count" hidden></span>
          </button>
        </div>
        </div>

        <section class="tasks-panel" id="tasks" aria-labelledby="tasks-title">
          <header class="tasks-head">
            <h2 id="tasks-title">Today</h2>
            <span class="tasks-head-end">
              <span class="tasks-meta" id="tasks-meta"></span>
              <span class="menu-anchor">
                <button class="icon-sm" id="tasks-menu" type="button" aria-label="Task options">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></svg>
                </button>
              </span>
            </span>
          </header>
          <form class="task-add" autocomplete="off">
            <input name="title" maxlength="120" placeholder="What are you working on?" aria-label="New task" />
            <label class="est" title="Estimated pomodoros">🍅<input name="estimate" type="number" min="1" max="20" value="1" aria-label="Estimated pomodoros" /></label>
            <button class="btn solid" type="submit">Add</button>
          </form>
          <p class="tasks-empty">Add a task, then tap it to track your focus time against it.</p>
          <ul class="task-list"></ul>
          <section class="notes" id="notes" aria-labelledby="notes-title" hidden>
            <h3 id="notes-title">Noted for later</h3>
            <ul class="notes-list"></ul>
          </section>
          <footer class="tasks-foot">
            <span id="tasks-foot"></span>
            <button class="link-btn" id="tasks-clear" type="button" hidden>Clear finished</button>
          </footer>
        </section>
      </main>

      <footer class="app-foot">
        <a href="https://en.wikipedia.org/wiki/Pomodoro_Technique" target="_blank" rel="noopener"><span>The Pomodoro Technique</span> <span aria-hidden="true">↗</span></a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="https://github.com/parmsam/pomotimer2" target="_blank" rel="noopener" aria-label="Source on GitHub"><svg class="gh" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg><span>GitHub</span></a>
        <span class="sep" aria-hidden="true">·</span>
        <span class="app-version"></span>
      </footer>

      <p class="sr-only" aria-live="polite" id="live"></p>
    </div>

    <button id="focus-exit" class="focus-exit" type="button" hidden>Exit focus mode <kbd>F</kbd></button>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="settings" aria-label="Settings" hidden>
      <header class="drawer-head">
        <h2>Settings</h2>
        <button id="settings-close" class="icon-btn" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div class="drawer-body" id="settings-body"></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
